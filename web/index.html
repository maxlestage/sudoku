<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sudoku</title>
    <!--
      Splash screen, inlined so it paints before the JS bundle loads.
      App.tsx removes it once the first puzzle is ready.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: linear-gradient(160deg, #26264a 0%, #1a1a2e 45%, #1a1a2e 100%);
        color: #eaeaea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s ease;
      }

      @media (prefers-color-scheme: light) {
        #splash {
          background: linear-gradient(160deg, #ffffff 0%, #f2f2f7 45%, #f2f2f7 100%);
          color: #1a1a2e;
        }
      }

      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }

      #splash .splash-grid {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        gap: 8px;
        filter: drop-shadow(0 12px 24px rgb(0 0 0 / 35%));
      }

      #splash .splash-grid span {
        width: 52px;
        height: 52px;
        border-radius: 13px;
        transform: scale(0.2);
        opacity: 0;
        animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes splash-pop {
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      #splash .splash-title {
        font-size: 2.6rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: splash-in 0.45s ease 0.55s forwards;
      }

      #splash .splash-dots {
        display: flex;
        gap: 7px;
        margin-top: -1rem;
        opacity: 0;
        animation: splash-in 0.45s ease 0.55s forwards;
      }

      #splash .splash-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4895ef;
        animation: splash-pulse 0.7s ease-in-out infinite alternate;
      }

      @keyframes splash-pulse {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      #splash .splash-credits {
        position: absolute;
        bottom: 2.5rem;
        text-align: center;
        opacity: 0;
        animation: splash-in 0.45s ease 0.55s forwards;
      }

      #splash .splash-credits small {
        display: block;
        font-size: 0.75rem;
        opacity: 0.55;
      }

      #splash .splash-credits strong {
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.9;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-grid" aria-hidden="true">
        <span style="background: #e63946; animation-delay: 0s"></span>
        <span style="background: #f4a261; animation-delay: 0.055s"></span>
        <span style="background: #e9c46a; animation-delay: 0.11s"></span>
        <span style="background: #2a9d8f; animation-delay: 0.165s"></span>
        <span style="background: #4895ef; animation-delay: 0.22s"></span>
        <span style="background: #7b2cbf; animation-delay: 0.275s"></span>
        <span style="background: #ff70a6; animation-delay: 0.33s"></span>
        <span style="background: #80b918; animation-delay: 0.385s"></span>
        <span style="background: #8d6e63; animation-delay: 0.44s"></span>
      </div>
      <div class="splash-title">Sudoku</div>
      <div class="splash-dots" aria-hidden="true">
        <i style="animation-delay: 0s"></i>
        <i style="animation-delay: 0.18s"></i>
        <i style="animation-delay: 0.36s"></i>
      </div>
      <div class="splash-credits">
        <small data-splash-credits>Créé et développé par</small>
        <strong>Maxime Nathan Lestage</strong>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
