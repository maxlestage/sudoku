name: Sudoku
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "16.0"
targets:
  Sudoku:
    type: application
    platform: iOS
    sources: [Sudoku]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.sudoku
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sudoku/Info.plist
      properties:
        CFBundleDisplayName: Sudoku
        CFBundleLocalizations: [fr, es, en]
        UILaunchScreen: {}
